# 무선 펌프 보드용 MQTT 브로커 설정.
#
# ⚠ 익명 접속을 허용하지 않는다. 이 프로젝트가 쓰이는 망 중에 NAT 없이 공인 IP를
#   주는 곳이 실제로 있었다. 그런 망에서 allow_anonymous true 로 두면 브로커가
#   인터넷에 그대로 열리고, 아무나 펌프에 명령을 보낼 수 있다.
#
# 쓰기 전에 계정을 만들고 아래 password_file 을 **절대경로**로 맞춘다.
#
#   sudo mosquitto_passwd -c /etc/mosquitto/spacebio_passwd <계정>
#   sudo chown root:mosquitto /etc/mosquitto/spacebio_passwd
#   sudo chmod 640 /etc/mosquitto/spacebio_passwd
#
# ⚠ 데비안/라즈베리파이에서 이 파일을 /etc/mosquitto/conf.d/ 에 넣을 때:
#   - 패스워드 파일 권한이 root:root 600 이면 mosquitto 사용자가 못 읽어
#     status=13 으로 기동에 실패한다. 위 chown/chmod 를 반드시 한다.
#   - persistence_location 을 여기서 다시 쓰지 마라. 기본 설정(mosquitto.conf)과
#     중복돼 기동에 실패한다.

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/spacebio_passwd

# 로그
log_dest stderr
log_type warning
log_type notice
